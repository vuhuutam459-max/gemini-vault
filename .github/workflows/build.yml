name: Build desktop binaries

# Builds a self-contained Gemini Vault app for Windows, macOS and Linux.
# - On every push/PR to main: build all three and upload them as artifacts (CI check).
# - On a version tag (v1.2.3): also attach the packaged apps to a GitHub Release.
#
# Why CI for Mac/Linux? The maintainer develops on Windows; GitHub's hosted
# runners give us native macOS and Linux machines to produce real native builds
# (PyInstaller does NOT cross-compile — each OS must be built on its own runner).
#
# We build in one-DIR mode (a GeminiVault/ folder, not a single .exe): it starts
# without temp self-extraction and avoids the onefile bootloader's failure on
# non-ASCII paths.
#
# Packaging differs per OS:
#   - Windows: compile a real Inno Setup installer (iscc is pre-installed on
#     GitHub's windows-latest runners) -> installer\Output\GeminiVault-Setup.exe.
#   - macOS/Linux: tar the one-dir folder into a single archive.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on tags

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GeminiVault-windows
          - os: macos-latest
            artifact: GeminiVault-macos
          - os: ubuntu-latest
            artifact: GeminiVault-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests (offline, no network)
        run: |
          python processor/_test_llm_gateway.py
          python processor/_test_llm_client.py
          python processor/_test_librarian.py
          python processor/_test_serve_librarian.py
          python processor/_test_smart_api.py

      - name: Build app (one-dir)
        run: python build/build_windows.py

      # ── Windows: compile a real installer (Setup.exe) from the one-dir build ──
      # iscc (Inno Setup) ships pre-installed on GitHub's windows-latest runners.
      # It bundles dist\GeminiVault\* into installer\Output\GeminiVault-Setup.exe.
      - name: Compile installer (Inno Setup, Windows)
        if: runner.os == 'Windows'
        run: iscc installer\gemini_vault.iss

      # ── macOS/Linux: no installer toolchain, ship the one-dir folder as a tar ──
      - name: Package app folder (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czf "../${{ matrix.artifact }}.tar.gz" GeminiVault

      # ── Upload CI artifacts (the real deliverable per OS) ──
      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/Output/GeminiVault-Setup.exe
          if-no-files-found: error

      - name: Upload app folder (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      # ── On version tags, attach the per-OS deliverable to the GitHub Release ──
      - name: Attach installer to Release (Windows, tags)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/GeminiVault-Setup.exe
          fail_on_unmatched_files: true

      - name: Attach app folder to Release (macOS/Linux, tags)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: true
